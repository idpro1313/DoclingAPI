# Default values for docling-serve Helm chart.

# -- Number of replicas
replicaCount: 1

# -- Container image configuration
image:
  repository: ghcr.io/docling-project/docling-serve
  tag: latest
  pullPolicy: IfNotPresent
  pullSecrets: []

# -- Service configuration
service:
  type: ClusterIP
  port: 5001
  annotations: {}

# -- Metrics service configuration
metrics:
  enabled: true
  service:
    type: ClusterIP
    port: 9090
    annotations: {}

# -- Container ports
containerPorts:
  http: 5001
  metrics: 9090

# -- Ingress configuration
ingress:
  enabled: true
  className: nginx
  host: docling.example.com
  path: /
  pathType: Prefix
  tls:
    enabled: true
    secretName: ""
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-write-timeout: "3600"

# -- Service account configuration
serviceAccount:
  create: true
  name: ""
  annotations: {}

# -- Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# -- Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  privileged: false

# -- Resource limits and requests
resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

# -- Node selector
nodeSelector: {}

# -- Tolerations
tolerations: []

# -- Affinity rules
affinity: {}

# -- Topology spread constraints
topologySpreadConstraints: []

# -- Pod annotations
podAnnotations: {}

# -- Pod labels
podLabels: {}

# -- Liveness probe configuration
livenessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# -- Readiness probe configuration
readinessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# -- Startup probe configuration
startupProbe:
  enabled: false
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 30

# -- Horizontal Pod Autoscaler configuration
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: ""

# -- Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

# -- Configuration options for docling-serve
# All options map to DOCLING_SERVE_* environment variables
config:
  # -- Enable Gradio UI
  enable_ui: false

  # -- API host
  api_host: "0.0.0.0"

  # -- Log level (DEBUG, INFO, WARNING)
  log_level: INFO

  # -- Log format (text, json)
  log_format: text

  # -- Static files path (optional, mounted as volume)
  static_path: ""

  # -- Artifacts path (optional, for persistent storage)
  artifacts_path: ""

  # -- Scratch path (optional, for temporary files)
  scratch_path: ""

  # -- Single use results (delete after fetch)
  single_use_results: true

  # -- Load ML models at boot
  load_models_at_boot: true

  # -- Options cache size
  options_cache_size: 2

  # -- Enable remote services
  enable_remote_services: false

  # -- Allow external plugins
  allow_external_plugins: false

  # -- Allow custom VLM config
  allow_custom_vlm_config: false

  # -- Allow custom picture description config
  allow_custom_picture_description_config: false

  # -- Allow custom code/formula config
  allow_custom_code_formula_config: false

  # -- Allow custom table structure config
  allow_custom_table_structure_config: false

  # -- Allow custom layout config
  allow_custom_layout_config: false

  # -- Allow custom picture classification config
  allow_custom_picture_classification_config: false

  # -- Allow custom OCR config
  allow_custom_ocr_config: false

  # -- Show version info endpoint
  show_version_info: true

  # -- Enable management endpoints
  enable_management_endpoints: false

  # -- Debug error details
  debug_error_details: false

  # -- Maximum document timeout (seconds)
  max_document_timeout: 604800

  # -- Maximum number of pages
  max_num_pages: 9223372036854775807

  # -- Maximum file size (bytes)
  max_file_size: 9223372036854775807

  # -- Maximum sources per request
  max_sources_per_request: 3

  # -- Max images scale
  max_images_scale: 2.0

  # -- Artifact storage (S3-compatible)
  artifact_storage_enabled: false
  artifact_storage_endpoint: ""
  artifact_storage_bucket: ""
  artifact_storage_key_prefix: "converted/"
  artifact_storage_presign_ttl_seconds: 3600

  # -- Threading pipeline settings
  queue_max_size: ""
  ocr_batch_size: ""
  layout_batch_size: ""
  table_batch_size: ""
  batch_polling_interval_seconds: ""

  # -- Sync polling settings
  sync_poll_interval: 2
  max_sync_wait: 120

  # -- CORS settings
  cors_origins: "*"
  cors_methods: "*"
  cors_headers: "*"

  # -- Local engine settings
  eng_kind: local
  eng_loc_num_workers: 2
  eng_loc_share_models: false

  # -- OpenTelemetry settings
  otel_enable_metrics: true
  otel_enable_traces: false
  otel_enable_prometheus: true
  otel_service_name: "docling-serve"

  # -- Metrics port
  metrics_port: 9090

  # -- Default VLM preset
  default_vlm_preset: "granite_docling"

  # -- Default picture description preset
  default_picture_description_preset: "smolvlm"

  # -- Default code/formula preset
  default_code_formula_preset: "default"

  # -- Default picture classification preset
  default_picture_classification_preset: "document_figure_classifier_v2"

  # -- Default table structure settings
  default_table_structure_kind: "docling_tableformer"
  default_table_structure_preset: "tableformer_v1_accurate"

  # -- Default layout settings
  default_layout_kind: "docling_layout_default"
  default_layout_preset: "docling_layout_default"

  # -- Default OCR settings
  default_ocr_preset: "auto"
  default_ocr_kind: "auto"

# -- External model API configuration
externalModel:
  enabled: false
  # -- Base URL for external VLM/LLM (e.g., http://ollama:11434/v1)
  baseUrl: ""
  # -- API key for external model (use secretRef for production)
  apiKey: ""
  # -- Timeout for external model requests (seconds)
  timeout: 60.0
  # -- Default model name
  defaultModel: ""

# -- Secrets configuration
# Use existingSecret for production, or set values directly for development
secrets:
  # -- Create default secret with values below
  create: true
  # -- Name of existing secret to use
  existingSecret: ""
  # -- API key for service authentication
  apiKey: ""
  # -- External model API key
  externalModelApiKey: ""

# -- Extra environment variables (map)
extraEnv: {}

# -- Extra environment variables from secrets (list)
extraEnvFrom: []

# -- Extra volume mounts
extraVolumeMounts: []

# -- Extra volumes
extraVolumes: []

# -- Init containers
initContainers: []

# -- Sidecar containers
sidecars: []

# -- Strategy for updates
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0