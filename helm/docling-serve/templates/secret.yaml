{{- /*
Create secret only if:
1. secrets.create is true AND (apiKey or externalModelApiKey is set)
2. OR secrets.existingSecret is not set and we need to create one
*/ -}}
{{- if and .Values.secrets.create (or .Values.secrets.apiKey .Values.externalModel.apiKey) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "docling-serve.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "docling-serve.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- if .Values.secrets.apiKey }}
  apiKey: {{ .Values.secrets.apiKey }}
  {{- end }}
  {{- if .Values.externalModel.apiKey }}
  externalModelApiKey: {{ .Values.externalModel.apiKey }}
  {{- end }}
{{- end }}