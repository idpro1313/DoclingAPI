{{- /*
Docling Serve Deployment Template
Maps all DOCLING_SERVE_* environment variables from values.yaml config section
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "docling-serve.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "docling-serve.labels" . | nindent 4 }}
  {{- with .Values.podLabels }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.annotations }}
  annotations:
  {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels:
      {{- include "docling-serve.selectorLabels" . | nindent 6 }}
  strategy:
    type: {{ .Values.strategy.type }}
    {{- with .Values.strategy.rollingUpdate }}
    rollingUpdate:
      maxSurge: {{ .maxSurge | default 1 }}
      maxUnavailable: {{ .maxUnavailable | default 0 }}
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "docling-serve.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "docling-serve.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPorts.http }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.containerPorts.metrics }}
              protocol: TCP
            {{- end }}
          env:
            # === Core Settings ===
            - name: DOCLING_SERVE_HOST
              value: {{ .Values.config.api_host | quote }}
            - name: DOCLING_SERVE_PORT
              value: {{ .Values.service.port | quote }}
            - name: DOCLING_SERVE_ENABLE_UI
              value: {{ .Values.config.enable_ui | quote }}
            - name: DOCLING_SERVE_LOG_LEVEL
              value: {{ .Values.config.log_level | quote }}
            - name: DOCLING_SERVE_LOG_FORMAT
              value: {{ .Values.config.log_format | quote }}
            - name: DOCLING_SERVE_SINGLE_USE_RESULTS
              value: {{ .Values.config.single_use_results | quote }}
            - name: DOCLING_SERVE_LOAD_MODELS_AT_BOOT
              value: {{ .Values.config.load_models_at_boot | quote }}
            - name: DOCLING_SERVE_OPTIONS_CACHE_SIZE
              value: {{ .Values.config.options_cache_size | quote }}
            # === Static/Artifact Paths ===
            {{- if .Values.config.static_path }}
            - name: DOCLING_SERVE_STATIC_PATH
              value: {{ .Values.config.static_path | quote }}
            {{- end }}
            {{- if .Values.config.artifacts_path }}
            - name: DOCLING_SERVE_ARTIFACTS_PATH
              value: {{ .Values.config.artifacts_path | quote }}
            {{- end }}
            {{- if .Values.config.scratch_path }}
            - name: DOCLING_SERVE_SCRATCH_PATH
              value: {{ .Values.config.scratch_path | quote }}
            {{- end }}
            # === Feature Flags ===
            - name: DOCLING_SERVE_ENABLE_REMOTE_SERVICES
              value: {{ .Values.config.enable_remote_services | quote }}
            - name: DOCLING_SERVE_ALLOW_EXTERNAL_PLUGINS
              value: {{ .Values.config.allow_external_plugins | quote }}
            - name: DOCLING_SERVE_ALLOW_CUSTOM_VLM_CONFIG
              value: {{ .Values.config.allow_custom_vlm_config | quote }}
            - name: DOCLING_SERVE_ALLOW_CUSTOM_PICTURE_DESCRIPTION_CONFIG
              value: {{ .Values.config.allow_custom_picture_description_config | quote }}
            - name: DOCLING_SERVE_ALLOW_CUSTOM_CODE_FORMULA_CONFIG
              value: {{ .Values.config.allow_custom_code_formula_config | quote }}
            - name: DOCLING_SERVE_ALLOW_CUSTOM_TABLE_STRUCTURE_CONFIG
              value: {{ .Values.config.allow_custom_table_structure_config | quote }}
            - name: DOCLING_SERVE_ALLOW_CUSTOM_LAYOUT_CONFIG
              value: {{ .Values.config.allow_custom_layout_config | quote }}
            - name: DOCLING_SERVE_ALLOW_CUSTOM_PICTURE_CLASSIFICATION_CONFIG
              value: {{ .Values.config.allow_custom_picture_classification_config | quote }}
            - name: DOCLING_SERVE_ALLOW_CUSTOM_OCR_CONFIG
              value: {{ .Values.config.allow_custom_ocr_config | quote }}
            - name: DOCLING_SERVE_SHOW_VERSION_INFO
              value: {{ .Values.config.show_version_info | quote }}
            - name: DOCLING_SERVE_ENABLE_MANAGEMENT_ENDPOINTS
              value: {{ .Values.config.enable_management_endpoints | quote }}
            - name: DOCLING_SERVE_DEBUG_ERROR_DETAILS
              value: {{ .Values.config.debug_error_details | quote }}
            # === Limits & Timeouts ===
            - name: DOCLING_SERVE_MAX_DOCUMENT_TIMEOUT
              value: {{ .Values.config.max_document_timeout | quote }}
            - name: DOCLING_SERVE_MAX_NUM_PAGES
              value: {{ .Values.config.max_num_pages | quote }}
            - name: DOCLING_SERVE_MAX_FILE_SIZE
              value: {{ .Values.config.max_file_size | quote }}
            - name: DOCLING_SERVE_MAX_SOURCES_PER_REQUEST
              value: {{ .Values.config.max_sources_per_request | quote }}
            - name: DOCLING_SERVE_MAX_IMAGES_SCALE
              value: {{ .Values.config.max_images_scale | quote }}
            # === Threading Pipeline ===
            {{- if .Values.config.queue_max_size }}
            - name: DOCLING_SERVE_QUEUE_MAX_SIZE
              value: {{ .Values.config.queue_max_size | quote }}
            {{- end }}
            {{- if .Values.config.ocr_batch_size }}
            - name: DOCLING_SERVE_OCR_BATCH_SIZE
              value: {{ .Values.config.ocr_batch_size | quote }}
            {{- end }}
            {{- if .Values.config.layout_batch_size }}
            - name: DOCLING_SERVE_LAYOUT_BATCH_SIZE
              value: {{ .Values.config.layout_batch_size | quote }}
            {{- end }}
            {{- if .Values.config.table_batch_size }}
            - name: DOCLING_SERVE_TABLE_BATCH_SIZE
              value: {{ .Values.config.table_batch_size | quote }}
            {{- end }}
            {{- if .Values.config.batch_polling_interval_seconds }}
            - name: DOCLING_SERVE_BATCH_POLLING_INTERVAL_SECONDS
              value: {{ .Values.config.batch_polling_interval_seconds | quote }}
            {{- end }}
            # === Sync Settings ===
            - name: DOCLING_SERVE_SYNC_POLL_INTERVAL
              value: {{ .Values.config.sync_poll_interval | quote }}
            - name: DOCLING_SERVE_MAX_SYNC_WAIT
              value: {{ .Values.config.max_sync_wait | quote }}
            # === CORS ===
            - name: DOCLING_SERVE_CORS_ORIGINS
              value: {{ .Values.config.cors_origins | quote }}
            - name: DOCLING_SERVE_CORS_METHODS
              value: {{ .Values.config.cors_methods | quote }}
            - name: DOCLING_SERVE_CORS_HEADERS
              value: {{ .Values.config.cors_headers | quote }}
            # === Local Engine ===
            - name: DOCLING_SERVE_ENG_KIND
              value: {{ .Values.config.eng_kind | quote }}
            - name: DOCLING_SERVE_ENG_LOC_NUM_WORKERS
              value: {{ .Values.config.eng_loc_num_workers | quote }}
            - name: DOCLING_SERVE_ENG_LOC_SHARE_MODELS
              value: {{ .Values.config.eng_loc_share_models | quote }}
            # === OpenTelemetry ===
            - name: DOCLING_SERVE_OTEL_ENABLE_METRICS
              value: {{ .Values.config.otel_enable_metrics | quote }}
            - name: DOCLING_SERVE_OTEL_ENABLE_TRACES
              value: {{ .Values.config.otel_enable_traces | quote }}
            - name: DOCLING_SERVE_OTEL_ENABLE_PROMETHEUS
              value: {{ .Values.config.otel_enable_prometheus | quote }}
            - name: DOCLING_SERVE_OTEL_SERVICE_NAME
              value: {{ .Values.config.otel_service_name | quote }}
            - name: DOCLING_SERVE_METRICS_PORT
              value: {{ .Values.config.metrics_port | quote }}
            # === Artifact Storage ===
            - name: DOCLING_SERVE_ARTIFACT_STORAGE_ENABLED
              value: {{ .Values.config.artifact_storage_enabled | quote }}
            {{- if .Values.config.artifact_storage_endpoint }}
            - name: DOCLING_SERVE_ARTIFACT_STORAGE_ENDPOINT
              value: {{ .Values.config.artifact_storage_endpoint | quote }}
            {{- end }}
            {{- if .Values.config.artifact_storage_bucket }}
            - name: DOCLING_SERVE_ARTIFACT_STORAGE_BUCKET
              value: {{ .Values.config.artifact_storage_bucket | quote }}
            {{- end }}
            - name: DOCLING_SERVE_ARTIFACT_STORAGE_KEY_PREFIX
              value: {{ .Values.config.artifact_storage_key_prefix | quote }}
            - name: DOCLING_SERVE_ARTIFACT_STORAGE_PRESIGN_TTL_SECONDS
              value: {{ .Values.config.artifact_storage_presign_ttl_seconds | quote }}
            # === Default Presets ===
            - name: DOCLING_SERVE_DEFAULT_VLM_PRESET
              value: {{ .Values.config.default_vlm_preset | quote }}
            - name: DOCLING_SERVE_DEFAULT_PICTURE_DESCRIPTION_PRESET
              value: {{ .Values.config.default_picture_description_preset | quote }}
            - name: DOCLING_SERVE_DEFAULT_CODE_FORMULA_PRESET
              value: {{ .Values.config.default_code_formula_preset | quote }}
            - name: DOCLING_SERVE_DEFAULT_PICTURE_CLASSIFICATION_PRESET
              value: {{ .Values.config.default_picture_classification_preset | quote }}
            - name: DOCLING_SERVE_DEFAULT_TABLE_STRUCTURE_KIND
              value: {{ .Values.config.default_table_structure_kind | quote }}
            - name: DOCLING_SERVE_DEFAULT_TABLE_STRUCTURE_PRESET
              value: {{ .Values.config.default_table_structure_preset | quote }}
            - name: DOCLING_SERVE_DEFAULT_LAYOUT_KIND
              value: {{ .Values.config.default_layout_kind | quote }}
            - name: DOCLING_SERVE_DEFAULT_LAYOUT_PRESET
              value: {{ .Values.config.default_layout_preset | quote }}
            - name: DOCLING_SERVE_DEFAULT_OCR_PRESET
              value: {{ .Values.config.default_ocr_preset | quote }}
            - name: DOCLING_SERVE_DEFAULT_OCR_KIND
              value: {{ .Values.config.default_ocr_kind | quote }}
            # === External Model API ===
            - name: DOCLING_SERVE_EXTERNAL_MODEL_ENABLED
              value: {{ .Values.externalModel.enabled | quote }}
            {{- if .Values.externalModel.baseUrl }}
            - name: DOCLING_SERVE_EXTERNAL_MODEL_BASE_URL
              value: {{ .Values.externalModel.baseUrl | quote }}
            {{- end }}
            {{- if .Values.externalModel.defaultModel }}
            - name: DOCLING_SERVE_EXTERNAL_MODEL_DEFAULT_MODEL
              value: {{ .Values.externalModel.defaultModel | quote }}
            {{- end }}
            - name: DOCLING_SERVE_EXTERNAL_MODEL_TIMEOUT
              value: {{ .Values.externalModel.timeout | quote }}
            {{- if .Values.secrets.apiKey }}
            - name: DOCLING_SERVE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "docling-serve.secretName" . }}
                  key: {{ include "docling-serve.apiKeyKey" . }}
            {{- end }}
            {{- if .Values.externalModel.apiKey }}
            - name: DOCLING_SERVE_EXTERNAL_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "docling-serve.secretName" . }}
                  key: {{ include "docling-serve.externalModelApiKeyKey" . }}
            {{- end }}
            {{- range $key, $value := .Values.extraEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            {{- range .Values.extraEnvFrom }}
            - {{ toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with .Values.livenessProbe }}
          {{- if .enabled }}
          livenessProbe:
            httpGet:
              path: {{ .path }}
              port: http
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          {{- if .enabled }}
          readinessProbe:
            httpGet:
              path: {{ .path }}
              port: http
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}
          {{- with .Values.startupProbe }}
          {{- if .enabled }}
          startupProbe:
            httpGet:
              path: {{ .path }}
              port: http
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}
          volumeMounts:
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}