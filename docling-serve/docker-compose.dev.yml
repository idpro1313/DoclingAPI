# Docling Serve Docker Compose - Development Configuration
# Usage: docker-compose -f docker-compose.dev.yml up --build
#
# Features:
# - Bind mount for source code (no rebuild needed for code changes)
# - Larger memory for model loading
# - Verbose logging for debugging

services:
  docling-serve:
    build:
      context: .
      dockerfile: Dockerfile.optimized
    container_name: docling-serve-dev
    ports:
      - "5001:5001"
    environment:
      # Server settings
      - DOCLING_SERVE_HOST=0.0.0.0
      - DOCLING_SERVE_PORT=5001
      - DOCLING_SERVE_ENABLE_UI=true
      - DOCLING_SERVE_LOG_LEVEL=DEBUG

      # Model loading
      - DOCLING_SERVE_LOAD_MODELS_AT_BOOT=false

      # External model API (Ollama/vLLM)
      - DOCLING_SERVE_EXTERNAL_MODEL_ENABLED=true
      - DOCLING_SERVE_EXTERNAL_MODEL_TIMEOUT=60
    volumes:
      # Bind mount source code for hot reload (no rebuild needed)
      - ./docling_serve:/app/docling_serve
      # Persistence volumes
      - docling-data:/data
      - docling-scratch:/tmp/docling-scratch
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - docling-dev

volumes:
  docling-data:
    driver: local
  docling-scratch:
    driver: local

networks:
  docling-dev:
    driver: bridge