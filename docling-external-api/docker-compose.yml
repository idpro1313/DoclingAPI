# Docker Compose for docling-external-api standalone service
# Runs docling-serve (official image) + docling-external-api sidecar

services:
  docling-serve:
    image: quay.io/docling-project/docling-serve:latest
    ports:
      - "5001:5001"
    environment:
      - DOCLING_SERVE_LOAD_MODELS_AT_BOOT=false
      - DOCLING_SERVE_ENABLE_UI=true
      - DOCLING_SERVE_ENABLE_REMOTE_SERVICES=true
      - DOCLING_SERVE_ALLOW_CUSTOM_VLM_CONFIG=true
      - DOCLING_SERVE_DEFAULT_VLM_PRESET=external_vlm
      - DOCLING_SERVE_CUSTOM_VLM_PRESETS={"presets":{"external_vlm":{"engine":"openai","url":"http://192.168.101.15:8111/v1","model":"minimax-m2.7","max_tokens":4096,"temperature":0.0}}}
    volumes:
      - docling-models:/app/.cache/docling/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  docling-external-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    environment:
      - DOCLING_SERVE_URL=http://docling-serve:5001
      - EXTERNAL_API_PORT=5002
    depends_on:
      docling-serve:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  docling-models: