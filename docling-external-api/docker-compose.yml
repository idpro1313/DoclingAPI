# Docker Compose for docling-external-api standalone service
# Runs docling-serve (official image) + docling-external-api sidecar

services:
  docling-serve:
    image: quay.io/docling-project/docling-serve:latest
    container_name: docling-serve
    ports:
      - "5001:5001"
    environment:
      - DOCLING_SERVE_LOAD_MODELS_AT_BOOT=false
      - DOCLING_SERVE_ENABLE_UI=true
    volumes:
      - docling-models:/app/.cache/docling/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  docling-external-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docling-external-api
    ports:
      - "5002:5002"
    environment:
      - EXTERNAL_API_DOCLING_SERVE_URL=http://docling-serve:5001
      - EXTERNAL_API_PORT=5002
      - EXTERNAL_API_VLM_ENABLED=1
      - EXTERNAL_API_VLM_BASE_URL=http://192.168.101.15:8111/v1
      - EXTERNAL_API_VLM_MODEL=minimax-m2.7
    depends_on:
      docling-serve:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  docling-models: