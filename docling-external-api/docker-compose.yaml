# Docker Compose for docling-external-api plugin
# Uses external OpenAI-compatible API (default: minimax-m2.7 at 192.168.101.15:8111)
#
# Usage:
#   docker compose up --build          # Build and run
#   docker compose up                   # Run (use existing image)
#   docker compose down                 # Stop and remove

services:
  # Docling Serve with External API Plugin
  docling-serve:
    build:
      context: ../
      dockerfile: ./docling-external-api/Dockerfile
    platform: "linux/amd64"
    container_name: docling-external-api
    ports:
      - "5001:5001"
    environment:
      # Basic settings
      - DOCLING_SERVE_ENABLE_UI=1
      - DOCLING_SERVE_LOAD_MODELS_AT_BOOT=false

      # External API Plugin - VLM Configuration (DEFAULT: minimax-m2.7)
      - EXTERNAL_API_VLM_ENABLED=1
      - EXTERNAL_API_VLM_BASE_URL=http://192.168.101.15:8111/v1
      - EXTERNAL_API_VLM_MODEL=minimax-m2.7
      # Set API key if required by your model server
      # - EXTERNAL_API_VLM_API_KEY=your-api-key

      # Enable remote services for external API access
      - DOCLING_SERVE_ENABLE_REMOTE_SERVICES=true

      # Optional: Enable external plugins (for pluggy-based plugins)
      - DOCLING_SERVE_ALLOW_EXTERNAL_PLUGINS=true

      # Artifacts path for downloaded models
      - DOCLING_SERVE_ARTIFACTS_PATH=/opt/app-root/src/.cache/docling/models

      # Logging
      - DOCLING_SERVE_LOG_LEVEL=INFO
      - DOCLING_SERVE_LOG_FORMAT=text

      # VLM preset configuration
      - DOCLING_SERVE_DEFAULT_VLM_PRESET=external_api_vlm
      - DOCLING_SERVE_ALLOWED_VLM_PRESETS=["external_api_vlm"]
      - DOCLING_SERVE_ALLOW_CUSTOM_VLM_CONFIG=true
    volumes:
      - docling-models:/opt/app-root/src/.cache/docling/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - docling-network


volumes:
  docling-models:
    driver: local


networks:
  docling-network:
    driver: bridge